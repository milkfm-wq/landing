<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>TERRA — сигналы участников</title>
<link rel="icon" type="image/svg+xml" href="./terra_favicon.svg?v=5">
<link rel="shortcut icon" href="./terra_favicon.svg?v=5">
<link rel="preconnect" href="https://script.google.com">
<style>
:root{
 color-scheme:light;
 --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
 --bg:#f6f4ef;--surface:#fffdfa;--surface-2:#f2f5f0;
 --line:#e3e5de;--line-strong:#cfd3ca;
 --ink:#25332f;--ink-2:#56625d;--ink-3:#6b7771;
 --green:#2f5a43;--green-bg:#dfe9df;--dot-ok:#4c9a6a;--bad:#984b4b;
 --heat-1-bg:#fbefd6;--heat-1-fg:#6b4a12;--heat-1-bar:#e2b866;
 --heat-2-bg:#f6d49a;--heat-2-fg:#5c3d08;--heat-2-bar:#e09a3c;
 --heat-3-bg:#ee9d6a;--heat-3-fg:#2f1a05;--heat-3-bar:#cf5a2e;
 --cell-zero:#f1f2ee;--bar-track:#ebeee8;--bar-neutral:#b9c0b7;
 --tag-bg:#efeaf6;--tag-fg:#5f4f7a;--focus:#1681ff;
 --r-card:14px;--r-ctl:10px;--r-tag:6px;--r-cell:6px;--r-pill:999px;
 --shadow-card:0 1px 2px rgba(37,51,47,.06)
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;width:100%;max-width:100%;overflow-x:clip}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:20px}
body.modal-open{overflow:hidden}
button,input,select{font-family:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.app{width:100%;max-width:1232px;margin:0 auto;padding:0 12px;min-width:0}
.visually-hidden{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
.topbar{padding:16px 0 8px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.brand{display:contents}
.brand h1{margin:0;width:100%;font-size:20px;line-height:26px;font-weight:700;letter-spacing:-.01em}
.header-chip{display:inline-flex;align-items:center;min-height:24px;height:24px;padding:0 10px;border-radius:var(--r-pill);background:var(--green-bg);color:var(--green);font-size:12px;line-height:16px;font-weight:600;white-space:nowrap;max-width:100%;font-variant-numeric:tabular-nums}
.statusbox{position:relative;display:flex;align-items:center;flex-wrap:wrap;gap:8px;min-width:0;color:var(--ink-2);font-size:12px;line-height:16px}
.status-title{display:flex;align-items:center;gap:8px;color:var(--ink-2);font-size:12px;line-height:16px;font-weight:400}
.status-dot{width:8px;height:8px;flex:none;background:var(--dot-ok);border-radius:50%}
.statusbox.error .status-dot{background:var(--bad)}
.statusbox.error .status-title{color:var(--bad)}
.info-dot{display:grid;place-items:center;width:24px;height:24px;padding:0;border:1px solid var(--line-strong);border-radius:50%;background:var(--surface);color:var(--ink-2);font-size:12px;line-height:16px;font-weight:700}
.info-btn{background:transparent;border:0;color:var(--ink-2);font-size:12px;line-height:16px;text-decoration:underline;text-decoration-style:dotted}
.info-pop{position:absolute;right:0;top:calc(100% + 8px);z-index:50;width:min(320px,calc(100vw - 24px));padding:12px;border-radius:var(--r-ctl);background:var(--ink);color:var(--surface);font-size:12px;line-height:16px;box-shadow:0 24px 64px rgba(20,35,30,.24)}
.info-pop[hidden]{display:none}
.info-pop p{margin:0 0 8px}.info-pop p:last-child{margin:0}
.load-track{height:4px;width:100px;overflow:hidden;background:var(--bar-track);border-radius:var(--r-pill)}
.load-track i{display:block;width:45%;height:100%;background:var(--green);animation:loading 1.25s ease-in-out infinite}
@keyframes loading{0%{transform:translateX(-120%)}60%{transform:translateX(100%)}100%{transform:translateX(270%)}}
.tabs{display:flex;gap:24px;height:44px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;align-items:center;height:44px;padding:0 4px;background:none;border:0;color:var(--ink-2);font-size:14px;line-height:20px;font-weight:600;white-space:nowrap}
.tab.active{color:var(--ink);box-shadow:inset 0 -2px 0 var(--ink)}
.tab .short{display:none}
.view{display:none}.view.active{display:block}
.hero{padding:0}.hero h2{margin:0}.hero p,.hero .period-chip{display:none}
.toolbar{display:grid;grid-template-columns:1.4fr 1fr;gap:8px;padding:12px 0 0;align-items:center}
.search-wrap{grid-column:1/-1;position:relative;min-width:0}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ink-3);pointer-events:none}
.input,.select{display:block;width:100%;min-width:0;height:44px;padding:0 12px;border:1px solid var(--line-strong);border-radius:var(--r-ctl);background:var(--surface);color:var(--ink);font-size:16px;line-height:24px;font-weight:400}
.input{padding-left:36px}.input::placeholder{color:var(--ink-3)}
.segment{display:flex;align-items:center;height:44px;padding:3px;border:1px solid var(--line);border-radius:var(--r-ctl);background:var(--surface-2);min-width:0}
.segment button{min-width:0;flex:1;height:100%;padding:0 4px;border:0;border-radius:7px;background:transparent;color:var(--ink-2);font-size:15px;line-height:20px;font-weight:600;white-space:nowrap}
.segment button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.legend{margin:8px 0 12px;color:var(--ink-2);font-size:12px;line-height:16px}
.legend-note{margin-bottom:8px}
.legend-items{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.legend-item{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.legend-square{display:inline-block;flex:none;width:12px;height:12px;border-radius:3px;border:1px solid transparent}
.legend-square.zero{background:var(--cell-zero);border-color:var(--line-strong)}
.legend-square.heat1{background:var(--heat-1-bg)}
.legend-square.heat2{background:var(--heat-2-bg)}
.legend-square.heat3{background:var(--heat-3-bg)}
.legend-square.unknown{background:transparent;border:1px dashed var(--line-strong)}
.signal-list{min-width:0;--n:1}
.signal-head{display:none}.signal-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:12px}.signal-desktop{display:none}
.signal-row{min-width:0;display:block;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow-card);cursor:pointer}
.signal-row:hover .school-title{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.signal-row .school-title{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:15px;line-height:20px;font-weight:600}
.school-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;min-width:0}
.school-head .title-wrap{min-width:0;flex:1}
.school-head .rate-block{flex:none;min-width:63px;text-align:right}
.rate-main{font-size:20px;line-height:24px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.rate-label{display:block;font-size:11px;line-height:14px;font-weight:500;color:var(--ink-2)}
.rate-block.low .rate-main,.desktop-rate.low .rate-main{color:var(--ink-2)}
.school-subline{display:flex;align-items:center;gap:8px;min-width:0;margin-top:4px}
.leader{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2);font-size:12px;line-height:16px;font-weight:400}
.school-subline .leader{flex:1}
.top-badge{display:inline-flex;flex:none;align-items:center;height:18px;padding:0 6px;border-radius:var(--r-tag);background:var(--tag-bg);color:var(--tag-fg);font-size:11px;line-height:14px;font-weight:600;white-space:nowrap}
.rate-track{width:100%;height:4px;overflow:hidden;background:var(--bar-track);border-radius:2px}
.rate-fill{height:100%;background:var(--heat-1-bar);border-radius:2px}
.rate-fill.heat2{background:var(--heat-2-bar)}.rate-fill.heat3{background:var(--heat-3-bar)}
.rate-fill.low{background:var(--bar-neutral)}
.card-rate-track{margin-top:12px}
.meta-line{margin-top:8px;color:var(--ink-2);font-size:13px;line-height:18px;font-weight:400}
.meta-line b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pill{display:inline-flex;gap:4px;align-items:center;height:24px;padding:0 10px;background:var(--surface-2);color:var(--ink-2);border-radius:var(--r-pill);font-size:12px;line-height:16px;font-weight:500}
.pill b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.card-lessons{margin-top:12px}
.lesson-label{margin-bottom:8px;color:var(--ink-2);font-size:11px;line-height:14px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.lesson-grid{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:2px;justify-content:start;min-width:0;width:min(100%,calc(var(--n) * 42px - 2px))}
.lesson-number{min-width:0;text-align:center;color:var(--ink-2);font-size:11px;line-height:14px;font-weight:500;font-variant-numeric:tabular-nums}
.heat-cell{min-width:0;display:flex;align-items:center;justify-content:center;width:100%;height:32px;border-radius:var(--r-cell);background:var(--cell-zero);color:var(--ink-3);font-size:12px;line-height:16px;font-weight:600;font-variant-numeric:tabular-nums}
.heat-cell.zero{background:var(--cell-zero);color:var(--ink-3);font-weight:400}
.heat-cell.unknown{background:transparent;border:1px dashed var(--line-strong)}
.heat-cell.heat1{background:var(--heat-1-bg);color:var(--heat-1-fg)}
.heat-cell.heat2{background:var(--heat-2-bg);color:var(--heat-2-fg)}
.heat-cell.heat3{background:var(--heat-3-bg);color:var(--heat-3-fg)}
.signal-divider{grid-column:1/-1;margin:0;padding:8px 16px;background:var(--surface-2);color:var(--ink-2);font-size:12px;line-height:16px}
.empty{padding:32px 16px;text-align:center;color:var(--ink-2);font-size:14px;line-height:20px;grid-column:1/-1}
.summary-head{margin:24px 0 8px}
.summary-head h3{margin:0;font-size:16px;line-height:22px;font-weight:700}
.summary-head p{display:none}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.card,.kpi,.dq-kpi{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow-card)}
.kpi{padding:12px}.kpi:last-child{grid-column:1/-1}
.kpi .label{color:var(--ink-2);font-size:11px;line-height:14px;font-weight:500}
.kpi .value{margin-top:4px;color:var(--ink);font-size:20px;line-height:24px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .sub{color:var(--ink-2);font-size:11px;line-height:14px;margin-top:4px}
.skeleton{padding:4px}.sk-row{display:grid;grid-template-columns:2fr 1fr;gap:12px;padding:12px;border-bottom:1px solid var(--line)}.sk-row:last-child{border:0}
.sk{height:14px;border-radius:var(--r-cell);background:var(--bar-track);animation:pulse 1.4s ease-in-out infinite}.sk.tiny{width:70%}.sk.short{width:80%}
@keyframes pulse{50%{opacity:.35}}
.errorbox{padding:16px;margin:12px 0;background:var(--surface);border:1px solid var(--bad);border-radius:var(--r-card);color:var(--bad);font-size:14px;line-height:20px}
.retry-btn{min-height:44px;margin-top:12px;padding:8px 12px;background:var(--surface);border:1px solid var(--bad);border-radius:var(--r-ctl);color:var(--bad);font-weight:600}
.footer{margin:24px 0 12px;text-align:center;color:var(--ink-2);font-size:11px;line-height:14px}
.dialog{width:100%;max-width:none;max-height:88vh;margin:auto 0 0;border:0;border-radius:16px 16px 0 0;padding:0;background:var(--surface);color:var(--ink);box-shadow:0 24px 64px rgba(20,35,30,.24);overflow:hidden;animation:slidein 200ms ease-out}
.dialog::backdrop{background:rgba(24,31,29,.45)}
@keyframes slidein{from{transform:translateY(100%)}to{transform:translateY(0)}}
.dialog-handle{display:block;width:36px;height:4px;margin:8px auto 0;background:var(--line-strong);border-radius:2px}
.dialog-head{position:sticky;top:0;z-index:2;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px;background:var(--surface);border-bottom:1px solid var(--line)}
.dialog-head h3{margin:0;color:var(--ink);font-size:18px;line-height:24px;font-weight:700}
.dialog-head p{margin:4px 0 0;color:var(--ink-2);font-size:13px;line-height:18px;font-weight:400}
.close-btn{width:40px;height:40px;flex:none;border:1px solid var(--line);border-radius:var(--r-ctl);background:var(--surface);color:var(--ink);font-size:22px;line-height:24px}
.dialog-body{padding:16px;overflow-y:auto;max-height:calc(88vh - 105px)}
.school-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mini{padding:12px;min-width:0;background:var(--surface-2);border-radius:12px}
.mini .lab{font-size:11px;line-height:14px;color:var(--ink-2);font-weight:500}
.mini .val{margin-top:4px;font-size:20px;line-height:24px;color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.focus-note{margin:12px 0;padding:10px 12px;border-left:3px solid var(--heat-2-bar);border-radius:8px;background:var(--heat-1-bg);color:var(--heat-1-fg);font-size:13px;line-height:18px}.focus-note b{font-weight:600}
.lesson-table{width:100%;border-collapse:collapse}
.lesson-table th,.lesson-table td{padding:10px 12px;border-bottom:1px solid var(--line);font-size:14px;line-height:20px;text-align:left;font-variant-numeric:tabular-nums}
.lesson-table th{color:var(--ink-2);font-size:11px;line-height:14px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.lesson-table .hot-row{background:var(--heat-1-bg)}.lesson-table .unknown-row{color:var(--ink-3)}
.dialog-rate{min-width:80px}.dialog-rate .rate-track{width:80px;margin-top:4px}
.mobile-lessons{display:block}
.mobile-lesson{padding:12px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:20px}
.mobile-lesson.hot-row{background:var(--heat-1-bg)}
.mobile-lesson .first{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.mobile-lesson .first b{font-weight:600}.mobile-lesson .numbers{font-variant-numeric:tabular-nums;text-align:right}
.mobile-lesson .rate-track{margin-top:8px;width:100%}
.mobile-lesson .breakdown{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;color:var(--ink-2);font-size:12px;line-height:16px}
.mobile-lesson.unknown-row{color:var(--ink-3)}.desktop-lessons{display:none}
.sectionhead{margin:24px 0 8px}.sectionhead h3{margin:0;font-size:16px;line-height:22px;font-weight:700}
.sectionhead p{margin:4px 0 0;color:var(--ink-2);font-size:12px;line-height:16px}
.dq-kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.dq-kpi{padding:12px}
.dq-kpi .n{margin-top:8px;font-size:20px;line-height:24px;font-weight:700;font-variant-numeric:tabular-nums}
.level{display:inline-block;padding:4px 8px;background:var(--surface-2);border-radius:var(--r-tag);color:var(--ink-2);font-size:11px;line-height:14px;font-weight:600}
.level.error{color:var(--bad)}.level.warning{color:var(--heat-2-fg)}.level.ok{color:var(--green)}
.tablewrap{max-width:100%;overflow-x:auto}.dq-table{border-collapse:collapse;width:100%;min-width:720px}
.dq-table td,.dq-table th{padding:12px;border-bottom:1px solid var(--line);font-size:11px;line-height:16px;text-align:left;vertical-align:top}
.dq-table th{background:var(--surface-2);font-size:11px;line-height:14px;color:var(--ink-2);font-weight:600}
.dq-title{font-weight:600}.dq-code{display:block;font-size:11px;line-height:14px;color:var(--ink-3)}
.method{padding:16px;font-size:14px;line-height:20px}.method h3{margin:24px 0 8px;font-size:16px;line-height:22px}.method h3:first-child{margin-top:0}
.method p{margin:8px 0;color:var(--ink-2)}
.rules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.rule{padding:12px;background:var(--surface-2);border-radius:var(--r-ctl);font-size:12px;line-height:16px}
.select,.tab,.segment button,.signal-row,.close-btn,.info-dot,.retry-btn{transition:background-color 120ms ease,box-shadow 120ms ease,transform 120ms ease}
@media(min-width:640px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.kpi:last-child{grid-column:auto}.mobile-lessons{display:none}.desktop-lessons{display:block}.dialog-body{max-height:calc(88vh - 100px)}}
@media(max-width:639px){.tab .full{display:none}.tab .short{display:inline}.rules{grid-template-columns:1fr}.school-summary{gap:4px}.mini{padding:8px}.mini .val{font-size:18px}}
@media(min-width:1200px){
.app{padding:0 24px}.topbar{height:64px;padding:0;display:flex;flex-wrap:nowrap;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px;min-width:0}.brand h1{width:auto;margin:0;font-size:24px;line-height:30px}
.statusbox{margin-left:auto;white-space:nowrap}
.toolbar{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;gap:8px;height:56px;padding:8px 0;align-items:center}
.search-wrap{grid-column:auto;flex:1;min-width:240px}.input,.select{height:40px;font-size:14px;line-height:20px}
.segment{width:188px;height:40px;flex:none}.segment button{font-size:14px}.select{width:200px;flex:none}
.signal-list{display:block;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);overflow:clip;box-shadow:var(--shadow-card);--n:1}
.signal-cards{display:none}.signal-desktop{display:block}
.signal-head,.signal-row{display:grid;grid-template-columns:minmax(206px,1fr) 128px 72px 72px 72px 72px 56px calc(var(--n) * 30px - 2px);column-gap:clamp(5px,.65vw,9px);padding-left:16px;padding-right:16px;min-width:0}
.signal-head{position:sticky;top:56px;z-index:10;height:52px;align-items:end;padding-bottom:8px;background:var(--surface);border-bottom:1px solid var(--line);color:var(--ink-2);font-size:11px;line-height:14px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.signal-head>span:nth-child(n+3):nth-child(-n+7){text-align:right}.signal-head .lessons-head{min-width:0;text-align:left}
.lesson-head-label{margin-bottom:4px}
.signal-row{min-height:72px;padding-top:12px;padding-bottom:12px;align-items:center;border:0;border-bottom:1px solid var(--line);border-radius:0;box-shadow:none}
.signal-row:last-child{border-bottom:0}.signal-row:hover{background:var(--surface-2)}
.school-head{display:block}.school-head .rate-block{display:none}
.signal-row .school-title{font-size:14px;line-height:20px}.school-subline{margin-top:4px}.school-subline .leader{font-size:12px}
.desktop-rate{display:block}.desktop-rate .rate-main{font-size:18px;line-height:24px}.desktop-rate .rate-track{margin-top:4px;width:104px}
.desktop-count{text-align:right;color:var(--ink-2);font-size:14px;line-height:20px;font-weight:500;font-variant-numeric:tabular-nums}
.desktop-count.emphasis{color:var(--ink);font-size:16px;font-weight:600}.desktop-count.zero{color:var(--ink-3);font-weight:400}
.lesson-head-numbers,.lesson-lane{display:grid;grid-template-columns:repeat(var(--n),28px);gap:2px;width:max-content}
.lesson-head-numbers .lesson-number{line-height:14px}.lesson-lane .heat-cell{width:28px;height:28px;font-size:13px}
.kpis{grid-template-columns:repeat(5,minmax(0,1fr))}.kpi:last-child{grid-column:auto}.kpi .value{font-size:22px;line-height:28px}
.dialog{width:min(720px,calc(100vw - 32px));max-height:80vh;margin:auto;border-radius:16px}
.dialog-handle{display:none}.dialog-body{max-height:calc(80vh - 92px)}
}
@media(max-width:1199px){.desktop-rate,.desktop-count{display:none}.lesson-head-numbers{display:none}}
@media(prefers-reduced-motion:reduce){.dialog,.load-track i,.sk{animation:none}}


/* Site 2 v02 — diagnostic usability corrections */
.info-pop{position:fixed;top:0;left:0;right:auto}
.info-pop{
 white-space:normal;overflow-wrap:break-word;word-break:normal;
 width:min(400px,calc(100vw - 24px));max-width:calc(100vw - 24px);
 max-height:min(68vh,440px);overflow-y:auto;
 font-size:12px;line-height:17px;text-align:left;
}
.info-pop p{white-space:normal;overflow-wrap:break-word;margin:0 0 12px;line-height:17px}
.info-pop p:last-child{margin-bottom:0}
.info-pop[hidden]{display:none}

<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <h1>Сигналы участников</h1>
      <span class="header-chip" id="flowChip">Загружаем период…</span>
    </div>
    <div class="statusbox" id="updated" aria-live="polite">
      <div class="status-title"><span class="status-dot"></span>Загружаем актуальные данные</div>
      <div class="load-track"><i></i></div>
    </div>
  </header>
  <nav class="tabs" aria-label="Разделы">
    <button class="tab active" data-view="signals"><span class="full">Сигналы за весь поток</span><span class="short">Сигналы</span></button>
    <button class="tab" data-view="quality"><span class="full">Контроль данных</span><span class="short">Контроль</span></button>
    <button class="tab" data-view="method"><span class="full">Методика</span><span class="short">Методика</span></button>
  </nav>

  
<main>
    <section class="view active" id="view-signals">
      <div class="hero"><h2>Сигналы за весь поток</h2><p>Сначала загружаются свежие данные. Таблица появится здесь автоматически.</p></div>
      <div class="card skeleton" aria-hidden="true">
        <div class="sk-row"><i class="sk"></i><i class="sk tiny"></i><i class="sk tiny"></i><i class="sk"></i></div>
        <div class="sk-row"><i class="sk"></i><i class="sk tiny"></i><i class="sk tiny"></i><i class="sk short"></i></div>
        <div class="sk-row"><i class="sk short"></i><i class="sk tiny"></i><i class="sk tiny"></i><i class="sk"></i></div>
        <div class="sk-row"><i class="sk"></i><i class="sk tiny"></i><i class="sk tiny"></i><i class="sk short"></i></div>
      </div>
    </section>
    <section class="view" id="view-quality"></section>
    <section class="view" id="view-method"></section>
  </main>

  <div class="footer">TERRA · сайт №2 · сигналы и контроль · показатели не меняют рейтинг школ</div>
</div>

<dialog class="dialog" id="schoolDialog"></dialog>
<div class="help-pop" id="helpPopover" role="status" hidden></div>

<script>
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dateRu(s){if(!s)return'—';const [y,m,d]=String(s).slice(0,10).split('-');return `${d}.${m}.${y}`}
function shortStamp(iso){if(!iso)return'—';const p=String(iso).split('T');if(p.length<2)return String(iso);const ymd=p[0].split('-');return `${ymd[2]}.${ymd[1]}.${ymd[0]} ${p[1].slice(0,5)}`}
function pct100(v,d=1){return v==null?'—':Number(v).toFixed(d).replace('.',',')+'%'}
function nfmt(v){return new Intl.NumberFormat('ru-RU').format(Number(v||0))}
function apiUrl(base,flow,view){const sep=base.includes('?')?'&':'?';return `${base}${sep}flow=${encodeURIComponent(flow)}&view=${encodeURIComponent(view)}`}
function plural(n,one,few,many){n=Math.abs(Number(n));const n10=n%10,n100=n%100;return n10===1&&n100!==11?one:n10>=2&&n10<=4&&(n100<12||n100>14)?few:many}

const API_VIEW='signals';
const DEFAULT_API_BASE='https://script.google.com/macros/s/AKfycbxMVZQ3K7VbshTnz0OOuRX6Tflpp9RthUPmu69_68bJtyguxUZkiU7pZw0SbVD8P0Tp9Q/exec';
const qs=new URLSearchParams(location.search);
const API_BASE=window.TERRA_API_URL||qs.get('api')||DEFAULT_API_BASE;
const FLOW=Number(qs.get('flow')||40);
const state={data:null,tab:'signals',signalMin:1,signalSort:'rate',search:'',dqLevel:'all',dqCategory:'all',dqCode:'all'};

function closeHelpPopover(){const p=document.getElementById('helpPopover');if(p)p.hidden=true;document.querySelectorAll('.info-dot[aria-expanded="true"][data-tip]').forEach(b=>b.setAttribute('aria-expanded','false'))}
function bindTips(root=document){
 root.querySelectorAll('.info-dot[data-tip],.info-btn[data-tip]').forEach(btn=>{
  if(btn.dataset.bound)return;
  btn.dataset.bound='1';btn.setAttribute('aria-expanded','false');
  btn.addEventListener('click',e=>{
   e.preventDefault();e.stopPropagation();
   const pop=document.getElementById('helpPopover'),was=!pop.hidden&&pop.dataset.owner===btn.dataset.helpId;
   closeHelpPopover();if(was)return;
   if(!btn.dataset.helpId)btn.dataset.helpId='help-'+(++helpSequence);
   pop.dataset.owner=btn.dataset.helpId;pop.textContent=btn.dataset.tip||'';pop.hidden=false;
   const rect=btn.getBoundingClientRect(),w=pop.offsetWidth,h=pop.offsetHeight;
   pop.style.left=Math.max(12,Math.min(window.innerWidth-w-12,rect.right-w))+'px';
   pop.style.top=(rect.bottom+8+h>window.innerHeight&&rect.top>h+16?rect.top-h-8:rect.bottom+8)+'px';
   btn.setAttribute('aria-expanded','true');
  });
 });
}
let helpSequence=0;
document.addEventListener('click',e=>{const pop=document.getElementById('helpPopover');if(pop&&!pop.hidden&&!pop.contains(e.target))closeHelpPopover()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeHelpPopover()});

function statusInfoMarkup(d){
 const last=shortStamp(d.meta?.sourceLastResponseAt),rows=nfmt(d.meta?.sourceRows);
 return `<button type="button" class="info-dot" id="statusInfoBtn" aria-label="О данных" aria-expanded="false">i</button><div class="info-pop" id="statusInfoPop" hidden><p>Рабочий доступ по ссылке. Авторизации нет. На странице нет текстовых комментариев и персональных ответов, только агрегированные показатели.</p><p>Сигнал — анкета, где участник отметил просьбу подписаться на соцсети или рекламу / продажи на занятии. Одна анкета считается одним сигналом, даже если отмечены оба пункта. Это рабочий индикатор для проверки ситуации, а не автоматический вывод о нарушении.</p><p>Рабочая панель руководителей кластеров и администрации. Последний ответ ${last} МСК · ${rows} строк.</p></div>`;
}
function liveStatus(d){return `<div class="status-title"><span class="status-dot"></span>Обновлено ${shortStamp(d.meta?.generatedAt)} МСК</div>${statusInfoMarkup(d)}`}
function bindStatusInfo(){
 const btn=document.getElementById('statusInfoBtn'),pop=document.getElementById('statusInfoPop');if(!btn||!pop)return;
 btn.onclick=e=>{e.stopPropagation();pop.hidden=!pop.hidden;btn.setAttribute('aria-expanded',String(!pop.hidden));if(!pop.hidden){const rect=btn.getBoundingClientRect(),w=pop.offsetWidth,h=pop.offsetHeight;pop.style.left=Math.max(12,Math.min(window.innerWidth-w-12,rect.right-w))+'px';pop.style.top=(rect.bottom+8+h>window.innerHeight&&rect.top>h+16?rect.top-h-8:rect.bottom+8)+'px'}};
 if(!document.body.dataset.infoBound){document.body.dataset.infoBound='1';document.addEventListener('click',e=>{const p=document.getElementById('statusInfoPop'),b=document.getElementById('statusInfoBtn');if(p&&!p.hidden&&!p.contains(e.target)&&!b.contains(e.target)){p.hidden=true;b.setAttribute('aria-expanded','false')}});document.addEventListener('keydown',e=>{if(e.key==='Escape'){const p=document.getElementById('statusInfoPop'),b=document.getElementById('statusInfoBtn');if(p&&!p.hidden){p.hidden=true;b?.setAttribute('aria-expanded','false')}}})}
}
function setLoading(attempt,total){
 const box=document.getElementById('updated');box.classList.remove('error');
 box.innerHTML=`<div class="status-title"><span class="status-dot"></span>${attempt<=1?'Загружаем актуальные данные':`Повторное подключение · попытка ${attempt} из ${total}`}</div><div class="load-track"><i></i></div>`;
}
function wait(ms){return new Promise(resolve=>setTimeout(resolve,ms))}
function loadJsonpOnce(url,timeoutMs,attempt){return new Promise((resolve,reject)=>{const callback='__terra_signals_'+Date.now()+'_'+attempt+'_'+Math.random().toString(36).slice(2);const script=document.createElement('script');let done=false;const timer=setTimeout(()=>finish(new Error('JSONP timeout')),timeoutMs);function finish(err,data){if(done)return;done=true;clearTimeout(timer);script.remove();if(err){window[callback]=function(){};setTimeout(()=>{try{delete window[callback]}catch(_){}},60000);reject(err)}else{try{delete window[callback]}catch(_){}resolve(data)}}window[callback]=data=>finish(null,data);script.onerror=()=>finish(new Error('JSONP network error'));script.async=true;script.referrerPolicy='no-referrer';const sep=url.includes('?')?'&':'?';const bucket=Math.floor(Date.now()/300000);script.src=url+sep+'callback='+encodeURIComponent(callback)+'&v='+bucket+'&attempt='+attempt;document.head.appendChild(script)})}
async function loadLiveData(){const url=apiUrl(API_BASE,FLOW,API_VIEW),timeouts=[15000,22000,30000,40000];let last=null;for(let i=0;i<timeouts.length;i++){setLoading(i+1,timeouts.length);try{const d=await loadJsonpOnce(url,timeouts[i],i+1);if(!d||typeof d!=='object')throw new Error('Пустой ответ API');if(d.error)throw new Error(d.message||d.error);return d}catch(e){last=e;if(i<timeouts.length-1)await wait(700*Math.pow(2,i))}}throw last||new Error('Не удалось загрузить данные')}
function showLoadError(e){console.error(e);const box=document.getElementById('updated');box.classList.add('error');box.innerHTML='<div class="status-title"><span class="status-dot"></span>Не удалось подключиться к данным</div><div>Все попытки завершились ошибкой.</div>';document.getElementById('view-signals').innerHTML='<div class="errorbox"><b>Актуальные данные не загрузились.</b><br>Старый снимок не показывается. Можно сразу повторить подключение.<br><button class="retry-btn" onclick="location.reload()">Повторить загрузку</button></div>'}

function signalTip(){return 'Анкет с сигналом — число анкет, где отмечены соцсети и/или реклама либо продажи. Одна анкета считается один раз, даже если отмечены оба пункта. Доля всех ответов = количество анкет с сигналом, разделённое на количество всех анкет потока, умноженное на 100.'}
const MIN_RESPONSES_FOR_SHARE = 20;
function percentLabel(v){
 if(v==null||!Number.isFinite(Number(v)))return '—';
 const x=Number(v);if(x>0&&x<0.1)return '<0,1%';
 return x.toLocaleString('ru-RU',{minimumFractionDigits:1,maximumFractionDigits:1})+'%';
}
function heatClass(p,responses,present=true){
 if(!present||!(Number(responses)>0))return 'unknown';
 if(!(Number(p)>0))return 'zero';
 const v=Number(p);return 'heat'+Math.min(v>=5?3:v>=2?2:1,Number(responses)<10?1:3);
}
function sortedLessons(r){return Array.isArray(r.lessonBreakdown)?r.lessonBreakdown:[]}
function lessonsN(){
 let max=1;
 for(const r of(state.data?.participantSignals?.cup?.allSchools||[]))
  for(const x of sortedLessons(r)){const k=Number(x.lesson);if(Number.isInteger(k)&&k>0)max=Math.max(max,k)}
 return Math.min(12,max);
}
function getLesson(r,id){
 const x=sortedLessons(r).find(x=>Number(x.lesson)===id);
 return x&&Number(x.responses)>0?x:null;
}
function heatCell(x,id){
 const count=Number(x?.flaggedResponses||0),p=Number(x?.flaggedRatePct||0),cl=heatClass(p,Number(x?.responses||0),!!x);
 const label=x?`Занятие ${id}: ${count} ${plural(count,'сигнал','сигнала','сигналов')} из ${nfmt(x.responses)} ${plural(x.responses,'ответа','ответов','ответов')} (${percentLabel(p)})`:`Занятие ${id}: нет сведений о сигналах`;
 return `<span class="heat-cell ${cl}" title="${esc(label)}" aria-label="${esc(label)}">${x&&count>0?nfmt(count):''}</span>`;
}
function lessonNums(n){return Array.from({length:n},(_,i)=>`<span class="lesson-number">${i+1}</span>`).join('')}
function lessonValues(r,n){return Array.from({length:n},(_,i)=>heatCell(getLesson(r,i+1),i+1)).join('')}
function rateBar(r,extra=''){
 const p=Number(r.flaggedRatePct||0),lvl=heatClass(p,Number(r.responses)||0,true);
 const low=Number(r.responses||0)<MIN_RESPONSES_FOR_SHARE;
 const fillClass=low?'low':lvl==='heat2'?'heat2':lvl==='heat3'?'heat3':'';
 return `<div class="rate-track ${extra}" aria-hidden="true"><div class="rate-fill ${fillClass}" style="width:${Math.max(0,Math.min(100,p*10))}%"></div></div>`;
}
function titleMarkup(r){return `<div class="school-title">№${esc(r.schoolId)} · ${esc(r.displayName||'—')}</div>`}
function subMarkup(r){return `<div class="school-subline"><span class="leader">${esc(r.leaderName||'')}</span>${r.isTop?'<span class="top-badge">ТОП-10</span>':''}</div>`}
function rateMarkup(r,card=false){
 const low=Number(r.responses||0)<MIN_RESPONSES_FOR_SHARE;
 return `<div class="${card?'rate-block':'desktop-rate'} ${low?'low':''}"><div class="rate-main">${percentLabel(r.flaggedRatePct)}</div>${card?'<span class="rate-label">доля</span>':rateBar(r)}</div>`;
}
function countMarkup(v,emph=false){
 const n=Number(v||0);
 return `<div class="desktop-count ${emph?'emphasis':''} ${n===0?'zero':''}">${nfmt(n)}</div>`;
}
function cardRow(r,n){
 const pills=[['Соцсети',r.socialSubscriptions],['Продажи',r.salesAdvertising],['Оба',r.bothFlags]].filter(([,v])=>Number(v)>0);
 return `<div class="signal-row" role="button" tabindex="0" data-school="${esc(r.schoolId)}" aria-label="Открыть сигналы школы №${esc(r.schoolId)}"><div class="school-head"><div class="title-wrap">${titleMarkup(r)}</div>${rateMarkup(r,true)}</div>${subMarkup(r)}${rateBar(r,'card-rate-track')}<div class="meta-line"><b>${nfmt(r.flaggedResponses)}</b> ${plural(r.flaggedResponses,'сигнал','сигнала','сигналов')} · <b>${nfmt(r.responses)}</b> ${plural(r.responses,'ответ','ответа','ответов')}</div>${pills.length?`<div class="pills">${pills.map(([key,v])=>`<span class="pill">${key} <b>${nfmt(v)}</b></span>`).join('')}</div>`:''}<div class="card-lessons"><div class="lesson-label">По занятиям</div><div class="lesson-grid" style="--n:${n}">${lessonNums(n)}${lessonValues(r,n)}</div></div></div>`;
}
function desktopRow(r,n){
 return `<div class="signal-row" role="button" tabindex="0" data-school="${esc(r.schoolId)}" aria-label="Открыть сигналы школы №${esc(r.schoolId)}"><div>${titleMarkup(r)}${subMarkup(r)}</div>${rateMarkup(r)}${countMarkup(r.flaggedResponses,true)}${countMarkup(r.responses)}${countMarkup(r.socialSubscriptions)}${countMarkup(r.salesAdvertising)}${countMarkup(r.bothFlags)}<div class="lesson-lane" style="--n:${n}">${lessonValues(r,n)}</div></div>`;
}
function getSignalRows(){
 const ps=state.data.participantSignals?.cup;
 let rows=(ps?.allSchools||[]).slice();const q=state.search.trim().toLowerCase();
 rows=rows.filter(r=>Number(r.flaggedResponses)>=state.signalMin)
  .filter(r=>!q||String(r.schoolId).includes(q)||String(r.displayName||'').toLowerCase().includes(q)||String(r.leaderName||'').toLowerCase().includes(q));
 if(state.signalSort==='rate')rows.sort((a,b)=>(Number(a.responses)<MIN_RESPONSES_FOR_SHARE)-(Number(b.responses)<MIN_RESPONSES_FOR_SHARE)||Number(b.flaggedRatePct)-Number(a.flaggedRatePct)||Number(b.flaggedResponses)-Number(a.flaggedResponses)||Number(b.responses)-Number(a.responses)||Number(a.schoolId)-Number(b.schoolId));
 else rows.sort((a,b)=>Number(b.flaggedResponses)-Number(a.flaggedResponses)||Number(b.flaggedRatePct)-Number(a.flaggedRatePct)||Number(a.schoolId)-Number(b.schoolId));
 return rows;
}
function renderListContent(rows,n,desktop=false){
 const maker=desktop?desktopRow:cardRow;
 if(state.signalSort==='rate'){
  const good=rows.filter(r=>Number(r.responses)>=MIN_RESPONSES_FOR_SHARE);
  const low=rows.filter(r=>Number(r.responses)<MIN_RESPONSES_FOR_SHARE);

function qualityFilteredRows(){const q=state.data.dataQuality?.signals||[];return q.filter(s=>(state.dqLevel==='all'||s.level===state.dqLevel)&&(state.dqCategory==='all'||s.category===state.dqCategory)&&(state.dqCode==='all'||s.code===state.dqCode)).sort((a,b)=>({error:0,warning:1,info:2}[a.level]??3)-({error:0,warning:1,info:2}[b.level]??3)||String(a.code||'').localeCompare(String(b.code||''),'ru')||Number(a.schoolId||0)-Number(b.schoolId||0))}
function renderDqCards(){const box=document.getElementById('dqCards');if(!box)return;const rows=qualityFilteredRows();document.getElementById('dqResults').textContent=`Найдено ${nfmt(rows.length)} ${plural(rows.length,'сигнал','сигнала','сигналов')} проверки`;box.innerHTML=rows.length?rows.map(diagnosticCard).join(''):'<div class="empty">По выбранным фильтрам ничего не найдено. Измените тип сигнала или важность.</div>'}
function qualityGlossary(signals){const codes=[...new Set(signals.map(s=>s.code))].sort((a,b)=>diagnosticType({code:a}).name.localeCompare(diagnosticType({code:b}).name,'ru'));return `<details class="dq-glossary"><summary>Что означают типы проверок? Справочник (${codes.length})</summary><div class="dq-glossary-list">${codes.map(code=>{const t=diagnosticType({code});return `<div class="dq-glossary-item"><b>${esc(t.name)}</b><p>${esc(t.explain)}</p><p><b>Что проверить:</b> ${esc(t.action)}</p></div>`}).join('')}</div></details>`}
function renderQuality(){
 const q=state.data.dataQuality||{signals:[],structure:{}},all=q.signals||[],el=document.getElementById('view-quality');
 const cats=[...new Set(all.map(s=>s.category))].sort(),codes=[...new Set(all.map(s=>s.code))].sort((a,b)=>diagnosticType({code:a}).name.localeCompare(diagnosticType({code:b}).name,'ru'));
 // Data-quality sourceRow checks include rows with an unrecognized flow; these cannot be attributed to flow 40 alone.
 const invalid=q.structure?.invalidRows,parse=q.structure?.schoolParseErrors;
 el.innerHTML=`<div class="dq-intro"><strong>Это не жалобы учеников на рекламу.</strong> Здесь автоматические проверки структуры анкет, активности ответов, оценок и рейтинга. Необычный показатель — повод разобраться, а не доказательство нарушения.</div><div class="dq-kpis"><div class="card dq-kpi"><div class="dq-kpi-title">Ошибки проверки</div><div class="n">${nfmt(q.errors)}</div><div class="dq-kpi-desc">Обнаруженные критические признаки</div></div><div class="card dq-kpi"><div class="dq-kpi-title">Нужно проверить</div><div class="n">${nfmt(q.warnings)}</div><div class="dq-kpi-desc">Ситуации, заслуживающие внимания</div></div><div class="card dq-kpi"><div class="dq-kpi-title">Информация</div><div class="n">${nfmt(q.info)}</div><div class="dq-kpi-desc">Наблюдения, не обязательно ошибки</div></div><div class="card dq-kpi"><div class="dq-kpi-title">Проверка исходных строк</div><div class="n">${invalid==null?'—':nfmt(invalid)}</div><div class="dq-kpi-desc">Строки с замечаниями по данным API; не равно числу ошибочных анкет школы</div></div></div><details class="dq-structure"><summary>Как понимать проверку исходных строк и распознавание школы?</summary><div class="raw-numbers"><span>Строк с замечаниями: <b>${invalid==null?'—':nfmt(invalid)}</b></span><span>Не удалось определить номер школы: <b>${parse==null?'—':nfmt(parse)}</b></span></div><p>Это результаты проверки всех исходных строк, переданные Google Apps Script. Для распознавания школы код пытается извлечь номер из значения поля «Выберите школу». Строки, где не распознан номер потока, также учитываются в общей проверке и не могут быть приписаны конкретному потоку. Число 24 999 (если оно показано) не означает 24 999 подтверждённых нарушений. Чтобы объяснить причины такого большого количества, нужна проверка исходных строк и алгоритма распознавания на стороне Apps Script.</p></details><div class="dq-quality-head"><h3>Диагностические сигналы</h3><p>Выберите тип проверки, чтобы увидеть все школы с одинаковым признаком. Каждая карточка поясняет единицы измерения и ориентир для сравнения.</p></div>${qualityGlossary(all)}<div class="dq-filters"><label class="dq-field"><span>Тип диагностического сигнала</span><select id="dqCode" class="select"><option value="all">Все типы (${nfmt(all.length)})</option>${codes.map(code=>`<option value="${esc(code)}">${esc(diagnosticType({code}).name)} (${diagnosticCountByCode(all,code)})</option>`).join('')}</select></label><label class="dq-field"><span>Категория</span><select id="dqCategory" class="select"><option value="all">Все категории</option>${cats.map(c=>`<option value="${esc(c)}">${esc(categoryNames[c]||c)}</option>`).join('')}</select></label><div class="dq-field"><span>Важность</span><div class="dq-levels" role="group" aria-label="Важность диагностического сигнала"><button type="button" data-level="all">Все</button><button type="button" data-level="error">Ошибки</button><button type="button" data-level="warning">Проверить</button><button type="button" data-level="info">Информация</button></div></div><div id="dqResults" class="dq-result-count" aria-live="polite"></div></div><div class="dq-cards" id="dqCards"></div>`;
 el.querySelector('#dqCode').value=state.dqCode||'all';el.querySelector('#dqCategory').value=state.dqCategory||'all';
 el.querySelector('#dqCode').onchange=e=>{state.dqCode=e.target.value;renderDqCards()};
 el.querySelector('#dqCategory').onchange=e=>{state.dqCategory=e.target.value;renderDqCards()};
 el.querySelectorAll('[data-level]').forEach(b=>{b.setAttribute('aria-pressed',String(b.dataset.level===state.dqLevel));b.onclick=()=>{state.dqLevel=b.dataset.level;el.querySelectorAll('[data-level]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));renderDqCards()}});
 renderDqCards();
}

function renderMethod(){const d=state.data,detail=d.config?.signalDetailVersion;document.getElementById('view-method').innerHTML=`<div class="hero"><h2>Как читать сигналы</h2><p>Короткое пояснение терминов и расчётов сайта №2.</p></div><div class="card method"><h3>Что считается сигналом</h3><p><b>Сигнал</b> — анкета, где участник отметил хотя бы один из двух пунктов: просьбу подписаться на соцсети или наличие скрытой / явной рекламы, продажи продукта, услуги или сервиса. Если в одной анкете отмечены оба пункта, это всё равно одна анкета с сигналом.</p><h3>Зачем нужна разбивка по занятиям</h3><p>Общее число за поток может скрывать концентрацию в конкретный день. Поэтому рядом со школой показываются занятия и количество сигналов на каждом из них. Это позволяет быстро увидеть, например: «на занятиях 1 и 2 было по пять сигналов, дальше — единичные».</p><h3>Что означает «доля»</h3><p>Доля = число анкет с сигналом / все анкеты этой школы или занятия. Поэтому одинаковые пять сигналов могут иметь разный вес при 20 и при 200 ответах.</p><h3>Это не рейтинг и не автоматическое нарушение</h3><p>Сигналы <b>не влияют на рейтинг школы</b>. Они показывают, куда руководителю стоит посмотреть. Решение о том, была ли проблема, принимается после проверки контекста.</p><h3>Каких данных здесь нет</h3><p>Сайт не публикует текстовые комментарии и персональные ответы участников. Сейчас используются только агрегированные ответы на структурированные вопросы.</p><div class="rules"><div class="rule"><b>Период:</b><br>весь текущий поток</div><div class="rule"><b>Детализация:</b><br>${detail?'по занятиям включена':'нужно обновление API для разбивки по занятиям'}</div></div></div>`}

function render(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===state.tab));document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id==='view-'+state.tab));if(!state.data)return;if(state.tab==='signals')renderSignals();if(state.tab==='quality')renderQuality();if(state.tab==='method')renderMethod();bindTips(document)}
function bind(){document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{state.tab=b.dataset.view;render()});bindTips(document)}
async function load(){
 const d=await loadLiveData();
 if(d.schemaVersion!=='1.5'||d.view!=='signals')throw new Error('Несовместимый API: '+d.schemaVersion+'/'+d.view);
 state.data=d;
 const from=d.flow?.flowStart,to=String(d.meta?.sourceLastResponseAt||'').slice(0,10);
 document.getElementById('flowChip').textContent=`Поток ${d.flow.id} · ${dateRu(from)} — ${dateRu(to)}`;
 document.getElementById('updated').innerHTML=liveStatus(d);
 bindStatusInfo();bind();render();
}
load().catch(showLoadError);
</script>
</body>
</html>
