<script>
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function f3(v){return v==null?'—':Number(v).toFixed(3).replace('.',',')}
function f2(v){return v==null?'—':Number(v).toFixed(2).replace('.',',')}
function pct(v,d=0){return v==null?'—':(Number(v)*100).toFixed(d).replace('.',',')+'%'}
function signed(v){if(v==null)return'—';const n=Number(v);return(n>0?'+':'')+n.toFixed(3).replace('.',',')}
function dateRu(s){if(!s)return'—';const [y,m,d]=String(s).slice(0,10).split('-');return `${d}.${m}.${y}`}
function shortStamp(iso){if(!iso)return'—';const p=String(iso).split('T');if(p.length<2)return String(iso);const ymd=p[0].split('-');return `${ymd[2]}.${ymd[1]}.${ymd[0]} ${p[1].slice(0,5)}`}
function schoolMeta(id){return state.data.schools[String(id)]||state.data.schools[id]||{schoolId:id,displayName:'Школа '+id,leaderName:'',isTop:false}}
function schoolNameHtml(r){return `<span class="schooltitle">№${r.schoolId} · ${esc(r.displayName)}</span>${r.isTop?'<span class="badge">ТОП</span>':''}<span class="leader">${esc(r.leaderName||'')}</span>`}
function apiUrl(base,flow,view){const sep=base.includes('?')?'&':'?';return `${base}${sep}flow=${encodeURIComponent(flow)}&view=${encodeURIComponent(view)}`}

const API_VIEW='public';
const DEFAULT_API_BASE='https://script.google.com/macros/s/AKfycbxMVZQ3K7VbshTnz0OOuRX6Tflpp9RthUPmu69_68bJtyguxUZkiU7pZw0SbVD8P0Tp9Q/exec';
const WEEK_MIN_RESPONSES=10;
const TOP_LIMIT=7;
const qs=new URLSearchParams(location.search);
const API_BASE=window.TERRA_API_URL||qs.get('api')||DEFAULT_API_BASE;
const FLOW=Number(qs.get('flow')||40);
const state={data:null,tab:'topWeek',schoolId:null};

function wait(ms){return new Promise(resolve=>setTimeout(resolve,ms))}
function loadJsonpOnce(url,timeoutMs,attempt){return new Promise((resolve,reject)=>{const callback='__terra_public_callback';const script=document.createElement('script');let done=false;const timer=setTimeout(()=>finish(new Error('JSONP timeout')),timeoutMs);function finish(err,data){if(done)return;done=true;clearTimeout(timer);script.remove();if(err){window[callback]=function(){};setTimeout(()=>{try{delete window[callback]}catch(_){}},60000);reject(err)}else{try{delete window[callback]}catch(_){}resolve(data)}}window[callback]=data=>finish(null,data);script.onerror=()=>finish(new Error('JSONP network error'));script.async=true;script.referrerPolicy='no-referrer';const sep=url.includes('?')?'&':'?';const bucket=Math.floor(Date.now()/300000);script.src=url+sep+'callback='+callback+'&v='+bucket+(attempt?'&retry='+attempt:'');document.head.appendChild(script)})}
/**
 * Firebase Realtime Database can serialize numeric-key objects as sparse
 * arrays containing null. Normalize collections back to keyed school records.
 * No ranking values or formulas are changed.
 */
function normalizeFirebasePublicData(data){
 const entries=Object.entries(data.schools).filter(([,school])=>school!==null&&typeof school==='object'&&!Array.isArray(school));
 if(!entries.length)throw new Error('Firebase вернул список школ без заполненных записей.');
 data.schools=Object.fromEntries(entries.map(([id,school])=>{
   if(Array.isArray(school.weeklyTrend)){
     school.weeklyTrend=school.weeklyTrend.filter(row=>row!==null&&typeof row==='object'&&!Array.isArray(row));
   }
   return [id,school];
 }));
 for(const period of Object.values(data.periods)){
   if(!period||typeof period!=='object')continue;
   for(const field of ['fullRanking','unrankedSchools','top7']){
     if(Array.isArray(period[field]))period[field]=period[field].filter(row=>row!==null&&typeof row==='object'&&!Array.isArray(row));
   }
 }
 return data;
}
const TERRA_PUBLIC_FB_URL='https://terra-dashboards-default-rtdb.europe-west1.firebasedatabase.app/published/flow40/public.json';
async function loadLiveData(){
  if(FLOW!==40)throw new Error('Тестовая Firebase-версия поддерживает только поток 40.');
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),12000);
  try{
    const response=await fetch(TERRA_PUBLIC_FB_URL,{method:'GET',cache:'no-store',signal:controller.signal,headers:{Accept:'application/json'}});
    if(!response.ok)throw new Error('Firebase пока не предоставляет public JSON (HTTP '+response.status+'). Сначала опубликуйте public и разрешите чтение /published/flow40/public.');
    const data=await response.json();
    if(!data || typeof data!=='object')throw new Error('Ответ Firebase пустой или не является объектом JSON.');
    if(data.view!=='public')throw new Error('Поле view: ожидалось public, получено '+String(data.view));
    if(data.schemaVersion!=='1.5')throw new Error('Поле schemaVersion: ожидалось 1.5, получено '+String(data.schemaVersion));
    if(Number(data.flow?.id)!==40)throw new Error('Поле flow.id: ожидалось 40, получено '+String(data.flow?.id));
    if(!data.meta?.generatedAt)throw new Error('Нет meta.generatedAt в полном JSON Firebase.');
    if(!data.schools || typeof data.schools!=='object')throw new Error('Нет раздела schools в полном JSON Firebase.');
    if(!data.periods || typeof data.periods!=='object')throw new Error('Нет раздела periods в полном JSON Firebase.');
    if(!data.periods.previousWeek || !data.periods.cup)throw new Error('Отсутствует periods.previousWeek или periods.cup.');
    if(!data.nominations)throw new Error('Отсутствует раздел nominations.');
    if(!data.config)throw new Error('Отсутствует раздел config.');
    normalizeFirebasePublicData(data);
    console.info('TERRA Firebase public response validated', {generatedAt:data.meta.generatedAt, schools:Object.keys(data.schools).length, view:data.view});
    return data;
  }catch(err){
    if(err&&err.name==='AbortError')throw new Error('Firebase не ответил в течение 12 секунд.');
    throw err;
  }finally{clearTimeout(timer)}
}
function liveStatus(d){const rows=new Intl.NumberFormat('ru-RU').format(d.meta?.sourceRows||0);return `<div class="ready"><span class="ready-dot"></span>Данные готовы</div><div>Обновлено ${shortStamp(d.meta?.generatedAt)} МСК</div><div>Последний ответ ${shortStamp(d.meta?.sourceLastResponseAt)} МСК · ${rows} строк</div>`}
function showLoadError(e){
 console.error('TERRA Firebase public load/render failed:',e);
 document.getElementById('updated').textContent='Ошибка загрузки или отображения';
 const main=document.querySelector('main');
 main.replaceChildren();
 const panel=document.createElement('div');panel.className='errorbox';
 const h=document.createElement('b');h.textContent='Тестовая страница: не удалось показать данные Firebase';panel.appendChild(h);
 const reason=document.createElement('p');reason.style.margin='12px 0 4px';reason.textContent='Причина: '+String(e?.message||e||'неизвестная ошибка');panel.appendChild(reason);
 const context=document.createElement('p');context.style.margin='8px 0 12px';context.textContent='Публичные метаданные уже доступны. Эта ошибка относится к загрузке полного JSON либо отображению рейтингов. Основной сайт не затронут.';panel.appendChild(context);
 const retry=document.createElement('button');retry.className='retry-btn';retry.type='button';retry.textContent='Повторить загрузку';retry.onclick=()=>location.reload();panel.appendChild(retry);
 main.appendChild(panel);
}

function priorWeekRankMap(){const d=state.data;const targetWeek=d.flow.completedWeeks-1;if(targetWeek<1)return new Map();const rows=[];Object.values(d.schools).forEach(s=>{const t=(s.weeklyTrend||[]).find(x=>Number(x.week)===targetWeek);if(t&&Number(t.responses)>=WEEK_MIN_RESPONSES&&t.score!=null)rows.push({schoolId:Number(s.schoolId),score:Number(t.score),responses:Number(t.responses)})});rows.sort((a,b)=>b.score-a.score||b.responses-a.responses||a.schoolId-b.schoolId);return new Map(rows.map((r,i)=>[r.schoolId,{rank:i+1,score:r.score}]))}
function buildWeeklyPeriod(){const d=state.data,base=d.periods.previousWeek,prev=priorWeekRankMap();const ranked=[],unranked=[];Object.values(d.schools).forEach(s=>{const m=s.periodMetrics?.previousWeek||{};const responses=Number(m.responses||0);if(!responses)return;const score=m.score==null?null:Number(m.score);const meta={schoolId:Number(s.schoolId),displayName:s.displayName,leaderName:s.leaderName,isTop:!!s.isTop,responses,minResponses:WEEK_MIN_RESPONSES,responsesMissing:Math.max(0,WEEK_MIN_RESPONSES-responses),score};if(responses>=WEEK_MIN_RESPONSES&&score!=null)ranked.push(meta);else unranked.push({...meta,referenceScore:responses>=5?score:null,referenceScoreVisible:responses>=5})});ranked.sort((a,b)=>b.score-a.score||b.responses-a.responses||a.schoolId-b.schoolId);ranked.forEach((r,i)=>{r.rank=i+1;const p=prev.get(r.schoolId);r.previousRank=p?.rank||null;r.scoreDelta=p?Number(r.score)-Number(p.score):null;r.positionChange=p?p.rank-r.rank:null;r.isEligible=true});unranked.sort((a,b)=>b.responses-a.responses||a.schoolId-b.schoolId);return {...base,minResponses:WEEK_MIN_RESPONSES,fullRanking:ranked,unrankedSchools:unranked,top7:ranked.slice(0,TOP_LIMIT),summary:{...base.summary,rankedSchools:ranked.length,unrankedSchools:unranked.length}}}
function buildAllTimePeriod(){const p=state.data.periods.cup;return {...p,top7:(p.fullRanking||[]).slice(0,TOP_LIMIT)}}
function activePeriod(){return state.tab==='allTime'?buildAllTimePeriod():buildWeeklyPeriod()}

function tip(text,label='i'){return `<button class="info-dot" type="button" data-tip="${esc(text)}" aria-label="Пояснение">${label}</button>`}
function movementText(r){if(!r.previousRank)return '—';return `<b>№${r.previousRank} → №${r.rank}</b>`}
function top7Rows(rows){return `<div class="card top7-list"><div class="top7-head"><span>Место</span><span>Школа</span><span>Было → стало</span><span>Оценок</span><span>Балл ${tip('Средняя оценка школы по пяти вопросам анкеты после занятий. Максимум — 5,00.')}</span></div>${rows.map(r=>`<div class="top7-row"><div class="place">${r.rank}</div><div class="top7-schoolcell"><div class="schoolname">№${r.schoolId} · ${esc(r.displayName)}${r.isTop?'<span class="badge">ТОП</span>':''}</div><span class="leader">${esc(r.leaderName||'')}</span></div><div class="top7-metrics"><div class="top7-metric movement num"><span class="top7-metric-label">Было → стало</span><span class="top7-metric-value">${movementText(r)}</span></div><div class="top7-metric answers num"><span class="top7-metric-label">Оценок</span><span class="top7-metric-value">${r.responses}</span></div><div class="top7-metric score num"><span class="top7-metric-label">Балл</span><span class="top7-metric-value">${f3(r.score)}</span></div></div></div>`).join('')}</div>`}
function kpi(label,value,sub='',help=''){return `<div class="kpi"><div class="label">${label}${help?tip(help):''}</div><div class="value num">${value}</div><div class="sub">${sub}</div></div>`}
function kpiStrip(p){return `<div class="kpi-strip">${kpi('Оценок учеников',p.summary.responses,`${p.summary.schoolsWithResponses} школ с оценками`,'Количество заполненных анкет обратной связи, учтённых за этот период.')}${kpi('Школ в рейтинге',p.summary.rankedSchools,`минимум ${p.minResponses} оценок`,'Для официального места школа должна набрать минимальное количество оценок учеников.')}${kpi('Средний балл',f3(p.summary.flowScore),'среднее по потоку','Средний итоговый балл всех школ этого потока. Балл считается по пяти показателям, максимум — 5,00.')}${kpi('Минимум для места',p.minResponses,'оценок учеников','Минимальное количество нужно, чтобы результат не зависел от нескольких случайных оценок.')}</div>`}
function matches(r,q){q=q.toLowerCase();return String(r.schoolId).includes(q)||String(r.displayName||'').toLowerCase().includes(q)||String(r.leaderName||'').toLowerCase().includes(q)}
function rankedRowHtml(r,isTopGroup=false){return `<tr class="schoolrow ${isTopGroup?'alltime-top':''}" data-school="${r.schoolId}"><td class="ranknum">${r.rank||'—'}</td><td>${schoolNameHtml(r)}</td><td class="movement num">${movementText(r)}</td><td class="num"><b>${r.responses}</b></td><td class="num score">${f3(r.score)}</td></tr>`}
function unrankedRowHtml(r){const miss=Math.max(0,Number(r.responsesMissing||0));return `<tr class="schoolrow" data-school="${r.schoolId}"><td class="ranknum">—</td><td>${schoolNameHtml(r)}<span class="leader status-wait">Пока без места</span></td><td class="movement">—</td><td class="num"><b>${r.responses} / ${r.minResponses}</b><div class="leader">${miss?`не хватает ${miss} ${miss===1?'оценки':'оценок'}`:'порог достигнут'}</div><div class="progress"><i style="width:${Math.min(100,100*r.responses/Math.max(1,r.minResponses))}%"></i></div></td><td class="num score">${r.referenceScoreVisible?f3(r.referenceScore):'—'}</td></tr>`}
function fullRankingTable(p){const q=(document.getElementById('rankSearch')?.value||'').trim().toLowerCase();const filter=document.getElementById('rankFilter')?.value||'all';const ranked=(p.fullRanking||[]).filter(r=>!q||matches(r,q));const unranked=(p.unrankedSchools||[]).filter(r=>!q||matches(r,q));let body='';if(filter!=='unranked')body+=ranked.map((r,i)=>rankedRowHtml(r,i<TOP_LIMIT)).join('');if(filter==='all'&&ranked.length&&unranked.length)body+=`<tr class="ranking-divider"><td colspan="5"><b>Официальный рейтинг заканчивается здесь</b>Ниже — школы, которым пока не хватает оценок учеников. Они отсортированы по количеству полученных оценок.</td></tr>`;if(filter!=='ranked')body+=unranked.map(unrankedRowHtml).join('');if(!body)body='<tr><td colspan="5" class="empty">Ничего не найдено</td></tr>';return `<div class="tablewrap"><table class="datatable"><thead><tr><th>Место</th><th>Школа</th><th>Было → стало</th><th>Оценок ${tip('Количество заполненных анкет обратной связи, учтённых в рейтинге за этот период.')}</th><th class="score-help">Балл ${tip('Средняя оценка школы по пяти вопросам анкеты после занятий. Максимум — 5,00.')}</th></tr></thead><tbody>${body}</tbody></table></div>`}
function bindRankingTable(p,container){const search=container.querySelector('#rankSearch'),filter=container.querySelector('#rankFilter'),target=container.querySelector('#fullRanking');function refresh(){target.innerHTML=fullRankingTable(p);bindTips(target);target.querySelectorAll('.schoolrow').forEach(tr=>tr.onclick=e=>{if(e.target.closest('.info-dot'))return;state.schoolId=Number(tr.dataset.school);state.tab='school';render()})}search.oninput=refresh;filter.onchange=refresh;refresh()}

function renderRankingView(kind){const isWeek=kind==='topWeek',p=isWeek?buildWeeklyPeriod():buildAllTimePeriod();const el=document.getElementById('view-'+kind);const range=isWeek?`${dateRu(p.dateFrom)} — ${dateRu(p.dateTo)}`:`с ${dateRu(p.dateFrom)} по ${dateRu(p.dateTo)}`;const hero=isWeek?`<div class="period-summary"><div><b>Итоги недели · ${range}</b><div class="context-line">В рейтинге участвуют школы, получившие не менее <b>${p.minResponses}</b> оценок учеников.</div></div>${tip('Неделя считается с понедельника по воскресенье по московскому времени. Публикуется последняя полностью завершённая неделя.')}</div>`:`<div class="hero"><h2>Общий рейтинг потока</h2><p>Результаты с начала текущего потока. Первые семь школ выделены, ниже продолжается полный список.</p><div class="period-chip">${range}</div></div>`;el.innerHTML=`${hero}${top7Rows(p.top7)}${kpiStrip(p)}<div class="sectionhead"><div><h3>Полный рейтинг</h3><p>Школы с достаточным количеством оценок ранжируются по баллу. Остальные показаны ниже отдельно.</p></div></div><div class="toolbar"><input class="input" id="rankSearch" placeholder="Найти школу по названию, руководителю или №"><select class="select" id="rankFilter"><option value="all">Все школы</option><option value="ranked">В рейтинге</option><option value="unranked">Пока без места</option></select></div><div class="card tablecard"><div id="fullRanking"></div></div>`;bindRankingTable(p,el);bindTips(el)}

const metricNames={topic:'Соответствие теме',practical:'Практическая полезность',logic:'Логика и структура',technical:'Технический комфорт',organization:'Организация занятия'};
const ratingMetricKeys=['topic','practical','logic','technical','organization'];
function findRank(period,schoolId){return (period.fullRanking||[]).find(r=>Number(r.schoolId)===Number(schoolId))||null}
function humanDelta(v){if(v==null)return'Нет данных для сравнения';const n=Number(v),a=Math.abs(n).toFixed(2).replace('.',',');if(Math.abs(n)<.005)return'На уровне среднего потока';return `На ${a} ${n>0?'выше':'ниже'} среднего по потоку`}
function renderSchool(){const d=state.data,ids=Object.keys(d.schools).map(Number).sort((a,b)=>a-b);if(!d.schools[state.schoolId])state.schoolId=ids[0];const s=schoolMeta(state.schoolId),week=buildWeeklyPeriod(),all=buildAllTimePeriod(),wr=findRank(week,s.schoolId),ar=findRank(all,s.schoolId);const wu=(week.unrankedSchools||[]).find(r=>Number(r.schoolId)===Number(s.schoolId)),au=(all.unrankedSchools||[]).find(r=>Number(r.schoolId)===Number(s.schoolId));const ws=wr||wu,as=ar||au;const metrics=ratingMetricKeys.map(k=>[k,s.metrics?.[k]]).filter(([,m])=>m);const weekRange=`${dateRu(week.dateFrom)} — ${dateRu(week.dateTo)}`;const perfect=pct(s.overall?.ratingPerfectResponseShare,0);const weekExplain=wr?`За ${weekRange}: <b>${wr.responses} оценок учеников</b>, средний балл <b>${f3(wr.score)}</b>. Это место среди школ, набравших минимум ${week.minResponses} оценок за неделю.`:ws?`За ${weekRange} получено <b>${ws.responses}</b> из ${week.minResponses} необходимых оценок. Официального места пока нет.`:'За последнюю завершённую неделю оценок пока нет.';const allExplain=ar?`С начала потока: <b>${ar.responses} оценок учеников</b>, средний балл <b>${f3(ar.score)}</b>. Это место среди школ, набравших минимум ${all.minResponses} оценок.`:as?`С начала потока получено <b>${as.responses}</b> из ${all.minResponses} необходимых оценок. Официального места пока нет.`:'С начала потока оценок пока нет.';const el=document.getElementById('view-school');el.innerHTML=`<div class="hero"><h2>Моя школа</h2><p>Здесь показаны место и оценки именно выбранной школы.</p></div><div class="toolbar"><select id="schoolSelect" class="select">${ids.map(id=>`<option value="${id}" ${id===Number(s.schoolId)?'selected':''}>№${id} · ${esc(schoolMeta(id).displayName)}</option>`).join('')}</select></div><div class="schoolhero"><div class="card"><div class="smalllabel">Выбранная школа · №${s.schoolId}${s.isTop?' · ТОП':''}</div><h2>${esc(s.displayName)}</h2><div class="school-explain">Руководитель: <b>${esc(s.leaderName||'не указан')}</b></div></div><div class="card"><div class="smalllabel">Место школы за последнюю завершённую неделю</div><div class="bigvalue">${wr?'№'+wr.rank:'—'}</div><div class="school-explain">${weekExplain}</div></div><div class="card"><div class="smalllabel">Место школы в общем рейтинге текущего потока</div><div class="bigvalue">${ar?'№'+ar.rank:'—'}</div><div class="school-explain">${allExplain}</div></div><div class="card"><div class="smalllabel">Анкеты этой школы с максимальными оценками ${tip('Доля анкет именно этой школы, где по всем пяти показателям рейтинга поставлена оценка 5 из 5.')}</div><div class="bigvalue">${perfect}</div><div class="school-explain">Доля анкет этой школы, где <b>все пять рейтинговых оценок — 5 из 5</b>.</div></div></div><div class="sectionhead"><div><h3>Профиль качества</h3><p class="profile-copy">Средняя оценка по каждому показателю, доля оценок 5 из 5 и сравнение со средним результатом потока.</p></div></div><div class="card detailcard">${metrics.map(([k,m])=>`<div class="metricrow"><b>${metricNames[k]}</b><div><div class="metricvalue num">${f2(m.value)} из 5</div><div class="bar"><i style="width:${Math.max(0,Math.min(100,(m.value-4)*100))}%"></i></div><div class="metricstats">${pct(m.fiveStarShare,0)} оценок — максимальные</div></div><div class="human-delta ${m.flowDelta>=0?'good':'bad'}">${humanDelta(m.flowDelta)}</div></div>`).join('')}</div><div class="sectionhead"><div><h3>Изменение среднего балла по неделям</h3><p>Каждая колонка — средняя оценка этой школы за соответствующую неделю.</p></div></div><div class="card detailcard">${spark(s.weeklyTrend)}</div>`;document.getElementById('schoolSelect').onchange=e=>{state.schoolId=Number(e.target.value);renderSchool()};bindTips(el)}


function spark(rows){if(!rows?.length)return'<div class="empty">Пока нет данных</div>';const vals=rows.map(r=>r.score).filter(v=>v!=null);const min=Math.min(...vals,4.5),max=Math.max(...vals,5);return `<div class="spark">${rows.map(r=>{const h=r.score==null?3:Math.max(8,(r.score-min)/(Math.max(.001,max-min))*85);return `<span style="height:${h}%" title="Неделя ${r.week}: ${f3(r.score)}"><i>${r.week}</i></span>`}).join('')}</div>`}
function renderNominations(){const n=state.data.nominations,el=document.getElementById('view-nominations');const perfect=n.fiveStarLeader;const perfectShare=perfect?.ratingPerfectResponseShare??perfect?.perfectResponseShare;const perfectCount=perfect?Math.round(Number(perfectShare||0)*Number(perfect.responses||0)):0;const cards=[['↗','Прорыв недели',n.breakthroughOfWeek,o=>`было №${o.previousRank} → стало №${o.currentRank}`,o=>`+${o.positionGain} мест`],['＋','Рост оценки',n.scoreGrowthOfWeek,o=>`${f3(o.previousScore)} → ${f3(o.currentScore)}`,o=>`рост ${signed(o.scoreDelta)} · ${o.currentResponses} оценок`],['◎','Рост числа оценок',n.responseGrowthOfWeek,o=>`${o.previousResponses} → ${o.currentResponses}`,o=>`+${Math.round(o.growthPct)}%`],['★','Доля максимальных анкет',perfect,o=>`${perfectCount} из ${o.responses} (${pct(o.ratingPerfectResponseShare??o.perfectResponseShare,0)})`,o=>'по всем пяти показателям — максимальная оценка']];el.innerHTML=`<div class="hero"><h2>Номинации недели</h2><p>Заметные изменения последней завершённой недели. На основной рейтинг не влияют.</p></div><div class="nomgrid">${cards.map(([ico,title,o,big,sub])=>`<div class="card nom"><div class="ico">${ico}</div><h3>${title}</h3>${o?`<b>№${o.schoolId} · ${esc(o.displayName)}</b><div class="big num">${big(o)}</div><p>${sub(o)}</p>`:'<div class="empty">Пока недостаточно данных</div>'}</div>`).join('')}</div>`}
function renderMethod(){const d=state.data;document.getElementById('view-method').innerHTML=`<div class="hero"><h2>Как устроен рейтинг</h2><p>Коротко о том, откуда берутся оценки и почему у некоторых школ пока нет места.</p></div><div class="card method"><h3>Что здесь называется школой и потоком</h3><p><b>Терра</b> — образовательная программа. <b>Школа</b> — отдельное образовательное направление внутри программы. <b>Поток</b> — группа школ, проходящих программу в один период.</p><h3>Итоговый балл</h3><p>Среднее пяти показателей: соответствие теме занятия, практическая полезность, логика и структура, технический комфорт и организация занятия. Каждый показатель оценивается по шкале от 1 до 5.</p><p><b>Рекомендация не влияет на место школы.</b> Ответ на вопрос о вероятности рекомендации хранится отдельно и не входит в средний балл.</p><p><b>Рейтинг каждый раз пересчитывается заново по всем исходным анкетам текущего потока.</b> Прошлые недели и изменение мест тоже рассчитываются из исходных ответов по этой же формуле из пяти показателей. Сохранённые старые рейтинги не используются.</p><h3>Недельный рейтинг</h3><p>Показывается последняя полностью завершённая календарная неделя — с понедельника по воскресенье по московскому времени. Для официального места нужно не менее <b>${WEEK_MIN_RESPONSES}</b> оценок учеников за неделю.</p><h3>Общий рейтинг потока</h3><p>Порог растёт вместе с числом полностью завершённых недель: <b>${d.config.cupResponsesPerWeek} × число завершённых недель</b>. Сейчас завершено <b>${d.flow.completedWeeks}</b>, поэтому для места нужно не менее <b>${d.flow.cupMinResponses}</b> оценок.</p><div class="rules"><div class="rule">За неделю: минимум <b>${WEEK_MIN_RESPONSES}</b> оценок</div><div class="rule">За поток сейчас: минимум <b>${d.flow.cupMinResponses}</b> оценок</div></div><h3>Как определяется место</h3><p>Сначала школы сортируются по точному неокруглённому среднему баллу. Если балл одинаковый — выше школа с большим количеством оценок, затем используется номер школы.</p><p>Минимальный порог помогает не делать вывод по нескольким случайным ответам. Небольшая разница между соседними школами сама по себе не означает статистически значимого различия.</p></div>`}
function bindTips(root=document){root.querySelectorAll('.info-btn,.info-dot').forEach(btn=>{if(btn.dataset.bound)return;btn.dataset.bound='1';btn.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();const was=btn.classList.contains('open');document.querySelectorAll('.info-btn.open,.info-dot.open').forEach(x=>x.classList.remove('open'));if(!was)btn.classList.add('open')})})}

function bind(){document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{state.tab=b.dataset.view;render()});bindTips(document);document.addEventListener('click',()=>document.querySelectorAll('.info-btn.open,.info-dot.open').forEach(x=>x.classList.remove('open')))}
function render(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===state.tab));document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id==='view-'+state.tab));if(state.tab==='topWeek')renderRankingView('topWeek');if(state.tab==='allTime')renderRankingView('allTime');if(state.tab==='school')renderSchool();if(state.tab==='nominations')renderNominations();if(state.tab==='method')renderMethod()}
async function load(){const d=await loadLiveData();if(d.schemaVersion!=='1.5'||d.view!=='public')throw new Error('Несовместимый API: '+d.schemaVersion+'/'+d.view);if(d.config?.ratingMethodVersion!=='five-metrics-full-recalc-v1'||d.config?.recommendationInScore!==false)throw new Error('API ещё использует старую формулу рейтинга. Сначала обновите Apps Script до v1.8.');state.data=d;state.schoolId=Number(Object.keys(d.schools)[0]);document.getElementById('flowLabel').textContent=`TERRA · ПОТОК ${d.flow.id}`;document.getElementById('updated').innerHTML=liveStatus(d);bind();render()}
load().catch(showLoadError);
</script>
</body>
